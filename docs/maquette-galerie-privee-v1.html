<title>Galerie privée Linktrip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>:root{--pg:#fbfaf9;--pg-ink:#161320;--pg-2:#413c4e;--pg-3:#726c80;--pg-line:#ece9ef;--pg-seg:#f1eef4;--pg-seg-on:#fff;--frame:#161320;--mark:#ff5a1f;--fh:"Inter Tight","Inter",system-ui,sans-serif;--fbd:"Inter",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#14121b;--pg-ink:#f4f2f6;--pg-2:#cfcad8;--pg-3:#9a94a8;--pg-line:#2a2635;--pg-seg:#221f2c;--pg-seg-on:#34303f;--frame:#000;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#14121b;--pg-ink:#f4f2f6;--pg-2:#cfcad8;--pg-3:#9a94a8;--pg-line:#2a2635;--pg-seg:#221f2c;--pg-seg-on:#34303f;--frame:#000;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--pg);color:var(--pg-ink);font-family:var(--fbd);-webkit-font-smoothing:antialiased;padding-inline:20px;padding-block:0;margin:0}
.wrap{max-width:1600px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:28px 0 8px}
.brandrow{color:var(--pg-3);font-size:.84rem}
h1.t{font-family:var(--fh);font-weight:700;font-size:clamp(28px, 3.2vw + 4px, 40px);letter-spacing:-.03em;line-height:1.08;margin:18px 0 10px;text-wrap:balance}
.lede0{margin:0;max-width:62ch;color:var(--pg-2);font-size:1.02rem;line-height:1.55;text-wrap:pretty}
.segm{display:inline-flex;padding:4px;border-radius:12px;background:var(--pg-seg);gap:2px;border:1px solid var(--pg-line)}
.segm button{border:0;background:none;font:500 .9rem var(--fbd);color:var(--pg-3);padding:8px 14px;border-radius:9px;cursor:pointer}
.segm button[aria-pressed="true"]{background:var(--pg-seg-on);color:var(--pg-ink)}
.segm button:focus-visible{outline:2px solid var(--mark);outline-offset:3px}
section.blk{padding:40px 0 8px}
.rowg{display:flex;flex-wrap:wrap;justify-content:center;gap:44px 32px}
.shot{flex:0 1 340px;min-width:0;margin:0;display:flex;flex-direction:column;gap:12px}
.cap{display:flex;gap:10px;align-items:baseline}
.cap .n{font:600 .8rem var(--fbd);color:var(--pg-3);min-width:1.2em}
.cap b{font:600 1rem var(--fh);letter-spacing:-.015em}
.note{margin:0;color:var(--pg-2);font-size:.9rem;line-height:1.5;text-wrap:pretty}
.phone{width:100%;aspect-ratio:360/760;border-radius:46px;background:var(--frame);padding:10px}
.sc{--k:.8718;position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:#fff}
.k{position:absolute;left:0;top:0;width:390px;height:849px;transform:scale(var(--k));transform-origin:0 0;display:flex;flex-direction:column}
.k .ob{flex:1;min-height:0}
.status{height:44px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font:600 15px var(--fbd);color:#161320;background:#fff}
.status i{width:24px;height:12px;border:1.5px solid #161320;border-radius:3px;position:relative}
.status i::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;background:#161320;border-radius:1px}
footer.pg{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;border-top:1px solid var(--pg-line);margin-top:56px;padding:18px 0 28px;color:var(--pg-3);font-size:.84rem}
body[data-state="avant"] .new{display:none!important}
.only-old{display:none}
body[data-state="avant"] .only-old{display:revert}

/* Le cadre de la galerie de groupe, et les écrans de retrait de photo.

   Les écrans de galerie eux-mêmes sont dans
   components/gallery/gallery.module.css, partagé avec la boutique
   individuelle. Ne restent ici que .c_page — qui porte --op, la couleur du
   prestataire — et le parcours de retrait, qui a ses propres besoins. */
.c_page {
  --op-soft: color-mix(in srgb, var(--op) 10%, #fff);
  --ink: #161320;
  --ink-2: #413c4e;
  --ink-3: #726c80;
  --ink-4: #a6a0b2;
  --line: #ece9ef;
  --line-2: #f4f2f6;
  /* Blanc, et pas le papier crème du reste du produit : la boutique s'ouvre
     sur une photo pleine largeur, et un fond teinté sous une photo se lit
     comme une page mal chargée. */
  --bg: #ffffff;
  --ok: #16a34a;
  --ok-soft: #eaf7ef;

  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.c_page * {
  box-sizing: border-box;
  min-width: 0;
}

/* ── Demander le retrait d'une photo (brief §5.3) ──────────────────────
   Sans justification, sans preuve d'identité. Trois étapes assumées ici,
   contrairement à la galerie : on cherche UNE photo précise dans le tas, et
   le jour n'est pas forcément celui d'aujourd'hui. */
.c_hi {
  max-width: 640px;
  margin: 0 auto;
  padding: 26px 20px 4px;
}
.c_hi h1 {
  margin: 0;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.45rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.18;
}
.c_hi p {
  margin: 9px 0 0;
  font-size: 0.94rem;
  color: var(--ink-3);
  line-height: 1.55;
}

/* Le retour, au-dessus du titre, comme sur la boutique (gallery.module.css).
   Il remplace les liens « Changer de jour » et « Changer de créneau » qui
   traînaient en bas de page, sous les mentions. */
.c_back {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 34px;
  margin: 0 0 6px -9px;
  padding: 0 9px;
  border: 0;
  border-radius: 11px;
  background: none;
  font-family: inherit;
  font-size: 0.94rem;
  font-weight: 500;
  letter-spacing: -0.014em;
  color: var(--ink-3);
  cursor: pointer;
}
.c_back:active {
  background: var(--line-2);
}
.c_back:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: -2px;
}


.c_slots {
  max-width: 640px;
  margin: 0 auto;
  padding: 18px 20px 0;
}
.c_slot {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 15px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
}
.c_slot:last-child {
  border-bottom: 0;
}
.c_info {
  flex: 1;
}
.c_h {
  display: block;
  font-size: 1.03rem;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.c_a {
  display: block;
  margin-top: 2px;
  font-size: 0.88rem;
  color: var(--ink-4);
}
.c_n {
  flex: 0 0 auto;
  font-size: 0.88rem;
  color: var(--ink-4);
}

.c_grid {
  max-width: 640px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 18px 20px 0;
}
.c_cell {
  position: relative;
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  background: var(--line-2);
  box-shadow: inset 0 0 0 1px rgba(22, 19, 32, 0.07);
}
.c_cell img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.c_hideBar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 7px 4px;
  border: 0;
  background: rgba(13, 12, 18, 0.62);
  color: #fff;
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 500;
  cursor: pointer;
  /* La moulinette du retrait se pose à côté du texte, pas au-dessus. */
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.c_legal {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px;
  font-size: 0.84rem;
  color: var(--ink-4);
  line-height: 1.6;
}
.c_legal a,
.c_legal button {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  cursor: pointer;
}

/* Feuille unique des écrans client (boutique individuelle et galerie de
   groupe). Une seule, parce que les deux parcours montrent exactement la
   même chose au client : des photos, un prix, un bouton. Le peu qui diffère
   — le choix du créneau — est en bas de ce fichier.

   Le cadre de page (.g_page) reste dans les feuilles des routes : c'est lui
   qui porte --op, la couleur du prestataire. */

/* ── L'en-tête ─────────────────────────────────────────────────────────
   Le logo, le nom, rien d'autre. La version précédente y posait quatre
   liens de navigation qui ne menaient nulle part, un bouton compte et un
   panier : sur la page où quelqu'un s'apprête à taper son numéro de carte,
   ce n'était pas de l'encombrement mais un problème de confiance. */
.g_top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.g_topIn {
  max-width: 920px;
  margin: 0 auto;
  padding: 13px 20px;
  display: flex;
  align-items: center;
  gap: 11px;
}
/* Sur la boutique de groupe, l'en-tête est un lien vers son accueil. Il ne
   se souligne pas et ne change pas de couleur : c'est le logo qui se
   reconnaît, et un en-tête qui vire au bleu de lien ferait tache sur la
   page où l'on tape son numéro de carte. */
a.topIn {
  color: inherit;
  text-decoration: none;
}
a.topIn:active {
  opacity: 0.62;
}
a.topIn:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: -3px;
  border-radius: 12px;
}
.g_logo {
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  border-radius: 10px;
  overflow: hidden;
  background: var(--op);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.g_logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.g_name {
  font-size: 0.97rem;
  font-weight: 500;
  letter-spacing: -0.018em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── Le titre : ce que le client vérifie en premier ────────────────────
   L'activité et le lieu, puis le créneau. Ça marche aussi bien pour une
   galerie nominative que pour un lien de groupe, où il n'y a pas de prénom
   à afficher. */
.g_head {
  max-width: 920px;
  margin: 0 auto;
  padding: 22px 20px 16px;
}
.g_head h1 {
  margin: 0;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.56rem;
  font-weight: 600;
  letter-spacing: -0.032em;
  line-height: 1.15;
}
.g_sub {
  margin: 9px 0 0;
  font-size: 0.97rem;
  color: var(--ink-2);
}
.g_hint {
  margin: 6px 0 0;
  font-size: 0.94rem;
  color: var(--ink-4);
  line-height: 1.5;
}

/* ── Reculer d'un écran ────────────────────────────────────────────────
   Une flèche et un mot, au-dessus du titre, au même endroit sur tous les
   écrans du parcours. Ça remplace « Changer de créneau », lien glissé au
   milieu de la phrase d'aide : le recul se cherche en haut de l'écran, pas
   au milieu d'un paragraphe.

   Le retrait à gauche rattrape le rembourrage de la zone touchée, pour que
   le mot s'aligne au pixel près sur le titre qu'il surplombe. */
.g_back {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 34px;
  margin: 0 0 6px -9px;
  padding: 0 9px;
  border: 0;
  border-radius: 11px;
  background: none;
  font-family: inherit;
  font-size: 0.94rem;
  font-weight: 500;
  letter-spacing: -0.014em;
  color: var(--ink-3);
  cursor: pointer;
}
.g_back:active {
  background: var(--line-2);
}
.g_back:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: -2px;
}


/* ── Les photos ────────────────────────────────────────────────────────
   Un seul geste sur une vignette : toucher choisit. Le bouton « agrandir »
   n'apparaît qu'au survol, donc jamais sur un écran tactile, où deux
   actions sur le même objet obligeraient à viser.

   Sur téléphone, ce n'est pas une grille mais un rail : une photo à la
   fois, calée au doigt. À deux colonnes sur 390 px, une vignette faisait
   165 px de large — on n'y reconnaît personne.

   La photo ne prend PAS toute la largeur : le début de la suivante
   dépasse à droite. C'est la seule chose qui dise qu'il y en a d'autres,
   et elle le dit sans indicateur à lire.

   La hauteur est plafonnée à ce qui reste sous le titre et au-dessus de
   la barre d'achat (unité svh, donc barres du navigateur comprises) :
   une photo qui passe sous la barre donne une page tronquée, et sur les
   petits téléphones le format 3/4 ne tient pas. */
.g_grid {
  max-width: 920px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  /* 14 px au-dessus : collée au filet de la barre de titre, la photo
     avait l'air coincée dessous. */
  padding: 14px 20px 0;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-padding-left: 20px;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.g_grid::-webkit-scrollbar {
  display: none;
}
.g_railPos {
  max-width: 920px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px 0;
}
.g_dots {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
}
.g_dots i {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--line);
  transition: width 0.14s, background 0.14s;
}
/* La photo en cours s'allonge, celles déjà prises passent à la couleur du
   prestataire : la rangée dit la position ET la sélection, ce que des
   points tous identiques ne disaient pas. */
.g_dots .g_dotOn {
  width: 18px;
  background: var(--ink-4);
}
.g_dots .g_dotGot {
  background: var(--op);
}
.g_count {
  flex: 1;
  margin: 0;
  font-size: 0.88rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
/* Le geste de prendre, à portée de pouce sous la photo. Il remplace la
   pastille posée dans le coin de l'image : sur un rail, la cible était à
   viser, et elle écrivait sur la photo. */
.g_take {
  flex: 0 0 auto;
  height: 42px;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: none;
  color: var(--ink);
  font-family: inherit;
  font-size: 0.94rem;
  font-weight: 600;
  letter-spacing: -0.018em;
  cursor: pointer;
}
.g_take:active {
  background: var(--line-2);
}
.g_take:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: 2px;
}
.g_takeOn {
  border-color: var(--op);
  color: var(--op);
}
.g_take svg {
  opacity: 0;
}
.g_takeOn svg {
  opacity: 1;
}
@media (prefers-reduced-motion: reduce) {
  .g_dots i {
    transition: none;
  }
}
.g_tile {
  position: relative;
  display: block;
  flex: 0 0 86%;
  scroll-snap-align: start;
  width: 100%;
  padding: 0;
  border: 0;
  aspect-ratio: 3 / 4;
  /* Ce qui reste sous la barre de titre et au-dessus de la barre d'achat.
     La réserve se lit : barre de titre 63 + marge 14 + rangée sous le
     rail 54 + barre d'achat 122 + un blanc de 37 avant la barre (assez
     pour la ligne « soit 6 € de plus » d'une sélection partielle). Au lot
     (.g_gridPack), la rangée n'a plus de bouton et la barre plus de ligne
     de titre. La zone du geste iOS s'ajoute : sans elle, le bas de la
     rangée passait sous la barre en mode application. */
  --reserve: 290px;
  max-height: calc(100vh - var(--reserve));
  max-height: calc(100svh - var(--reserve) - env(safe-area-inset-bottom));
  border-radius: 14px;
  overflow: hidden;
  background: var(--line-2);
  box-shadow: inset 0 0 0 1px rgba(22, 19, 32, 0.07);
  cursor: pointer;
  transition: box-shadow 0.14s, transform 0.14s;
  -webkit-touch-callout: none;
}
.g_gridPack .g_tile {
  --reserve: 235px;
}
.g_tile:active {
  transform: scale(0.985);
}
/* Choisie : un liseré à la couleur du prestataire, posé AU-DESSUS de la
   photo — une ombre intérieure passerait dessous et ne se verrait pas.
   Le liseré revient après avoir été retiré en août : il était alors le
   seul signe, sur une photo qui occupait presque tout l'écran. Il en est
   maintenant le troisième, avec le bouton sous le rail et la pastille de
   position, et la photo ne touche plus les bords. */
.g_tileOn::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  border: 3px solid var(--op);
  border-radius: 14px;
  pointer-events: none;
}
.g_tile img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}
/* Voir la photo en grand. Sur écran tactile le bouton est toujours là :
   sans survol, rien d'autre ne pourrait l'annoncer, et la photo en grand
   était jusqu'ici hors de portée sur téléphone. Au pointeur, il continue
   d'apparaître au survol, pour ne pas charger la grille. */
.g_zoom {
  position: absolute;
  z-index: 2;
  left: 9px;
  bottom: 9px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 11px;
  background: rgba(13, 12, 18, 0.5);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
}


/* Réservé sous la barre d'achat, qui est posée par-dessus la page. Ce bloc
   est le DERNIER de la page, après les mentions et le pied de page : posé
   plus haut (juste après la grille), il laissait la dernière ligne des
   mentions passer sous la barre. */
.g_pad {
  height: 158px;
}
/* Les mentions qui suivent le rail. Sur téléphone, leur marge est posée
   par PhotoPicker (placeRail) : elles s'affichent dans le blanc sous la
   photo si elles y tiennent entières, sinon elles passent sous la barre
   d'achat et la photo se centre dans l'espace. Jamais coupées par la
   barre, jamais de trou d'un seul côté. */
.g_legal.legalAfter {
  margin-top: 16px;
}

/* ── La barre d'achat ──────────────────────────────────────────────────
   Un seul endroit pour décider, toujours au même endroit, jamais
   désactivé : sans rien choisir, elle propose déjà ce que presque tout le
   monde prend. */
.g_bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  box-shadow: 0 -1px 0 rgba(22, 19, 32, 0.07);
}
.g_barIn {
  max-width: 920px;
  margin: 0 auto;
  padding: 14px 20px calc(22px + env(safe-area-inset-bottom));
}
.g_barRow {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 11px;
}
.g_barText {
  flex: 1;
}
/* Au lot, sur téléphone, le bouton porte tout : la ligne au-dessus ne
   faisait que le répéter. Sur ordinateur elle reste, la barre étant une
   ligne où le bouton se range à droite. */
.g_barRowPack {
  display: none;
}
.g_barLabel {
  display: block;
  font-size: 0.97rem;
  font-weight: 500;
  letter-spacing: -0.018em;
}
/* Sur téléphone, la relance « soit 6 € de plus » vit sous le bouton (.g_more).
   Sur ordinateur il y a la place pour la poser en seconde ligne, à gauche —
   d'où deux nœuds plutôt qu'un, chacun caché sur l'autre format. */
.g_barSub {
  display: none;
}
.g_barSide {
  flex: 0 0 auto;
  font-size: 0.94rem;
  color: var(--ink-4);
}
.g_clear {
  border: 0;
  background: none;
  padding: 0;
  font-family: inherit;
  font-size: 0.94rem;
  font-weight: 400;
  color: var(--ink-4);
  cursor: pointer;
}
.g_clear:hover {
  color: var(--ink-2);
}
.g_cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  height: 52px;
  border-radius: 14px;
  border: 0;
  font-family: inherit;
  font-size: 1.06rem;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: #fff;
  background: var(--op);
  cursor: pointer;
}
.g_cta:active {
  filter: brightness(0.94);
}
.g_cta:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: 3px;
}
.g_cta:disabled {
  opacity: 0.5;
  cursor: default;
}
/* Le seul argument de vente de l'écran, et il est vrai : le moteur de prix
   plafonne le total au prix du lot. Écrit une fois, sous le bouton. */
.g_more {
  margin: 11px 0 0;
  text-align: center;
  font-size: 0.9rem;
  color: var(--ink-3);
}
.g_more b {
  font-weight: 600;
  color: var(--ink);
}
.g_moreBtn {
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  font-weight: 600;
  color: var(--op);
  cursor: pointer;
}
.g_error {
  margin: 0 0 10px;
  font-size: 0.88rem;
  color: #dc2626;
}

/* ── Une photo en grand ────────────────────────────────────────────────*/
.g_box {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: #0d0c12;
  display: flex;
  flex-direction: column;
}
.g_boxTop {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 20px;
  flex: 0 0 auto;
}
.g_boxCount {
  flex: 1;
  font-size: 0.94rem;
  color: rgba(255, 255, 255, 0.72);
}
.g_boxClose {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
}
/* La photo est POSÉE dans ce cadre, jamais recadrée : l'image est étirée
   aux dimensions du cadre et `object-fit: contain` la laisse entière à
   l'intérieur. La version précédente comptait sur `max-height: 100%` au
   milieu d'une grille centrée — un pourcentage sans hauteur de référence,
   donc ignoré : la photo débordait par le bas et se retrouvait coupée. */
.g_boxPh {
  position: relative;
  flex: 1;
  min-height: 0;
  margin: 0 16px;
  border-radius: 18px;
  overflow: hidden;
}
.g_boxPh img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
/* Passer d'une photo à l'autre : les flèches sont posées sur le cadre, à
   portée de pouce sur téléphone, et doublées par le glissement au doigt et
   les touches du clavier. Elles disparaissent quand il n'y a qu'une photo. */
.g_boxNav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 999px;
  /* Même pastille que la croix de fermeture : un fond sombre serait
     invisible sur le fond noir de la visionneuse. */
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.g_boxNav:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}

.g_boxPrev {
  left: 10px;
}
.g_boxNext {
  right: 10px;
}
/* Colonne centrée : sur ordinateur le bouton passe en largeur automatique
   (voir la barre d'achat) et se retrouvait calé à gauche, sous une phrase
   centrée. Les deux partagent désormais le même axe. */
.g_boxFoot {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 20px calc(24px + env(safe-area-inset-bottom));
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
}
.g_boxNote {
  margin: 12px 0 0;
  text-align: center;
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.6);
}

/* ── C'est à vous ──────────────────────────────────────────────────────*/
.g_done {
  max-width: 920px;
  margin: 0 auto;
  padding: 26px 20px 40px;
}
.g_doneHead {
  text-align: center;
}
.g_ok {
  display: inline-grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 999px;
  background: var(--ok-soft);
  color: var(--ok);
}
.g_doneText {
  min-width: 0;
}
.g_doneHead h1 {
  margin: 16px 0 0;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.56rem;
  font-weight: 600;
  letter-spacing: -0.032em;
}
.g_doneGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 22px 0 0;
}
.g_doneTile {
  position: relative;
  display: block;
  aspect-ratio: 3 / 4;
  border-radius: 14px;
  overflow: hidden;
  background: var(--line-2);
  box-shadow: inset 0 0 0 1px rgba(22, 19, 32, 0.07);
}
.g_doneTile img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.g_save {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--ink);
  display: grid;
  place-items: center;
}
.g_card {
  margin: 24px 0 0;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
}
.g_cardT {
  display: block;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: -0.018em;
}
.g_cardD {
  display: block;
  margin-top: 5px;
  font-size: 0.9rem;
  color: var(--ink-3);
  line-height: 1.5;
}
.g_quiet {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 44px;
  margin-top: 13px;
  padding: 0 16px;
  border: 0;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.94rem;
  font-weight: 500;
  color: var(--ink-2);
  background: var(--line-2);
  cursor: pointer;
}

/* ── Bas de page ───────────────────────────────────────────────────────*/
.g_legal {
  max-width: 920px;
  margin: 20px auto 0;
  padding: 0 20px;
  font-size: 0.81rem;
  color: var(--ink-3);
  line-height: 1.6;
  text-wrap: pretty;
}
.g_legal a,
.g_legal button {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  cursor: pointer;
}
.g_powered {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 26px 20px 34px;
  font-size: 0.78rem;
  color: var(--ink-4);
}

/* ── La feuille de paiement ────────────────────────────────────────────*/
.g_sheet {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.g_bd {
  position: absolute;
  inset: 0;
  background: rgba(22, 19, 32, 0.44);
}
.g_pn {
  position: relative;
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 26px 26px 0 0;
  padding: 12px 20px calc(28px + env(safe-area-inset-bottom));
  box-shadow: 0 -18px 44px rgba(20, 19, 32, 0.16);
}
.g_grab {
  display: block;
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: #e6e3ea;
  margin: 0 auto 20px;
}
.g_sum {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 20px;
}
.g_sum span {
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.24rem;
  font-weight: 600;
  letter-spacing: -0.028em;
}
.g_sum b {
  font-size: 1.36rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.g_fld {
  margin-bottom: 16px;
}
.g_fld label {
  display: block;
  margin-bottom: 7px;
  font-size: 0.9rem;
  font-weight: 500;
}
.g_inp {
  width: 100%;
  height: 52px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
  font-family: inherit;
  font-size: 1rem;
  color: var(--ink);
}
.g_inp:focus {
  outline: 2px solid var(--op);
  outline-offset: -1px;
}
.g_inpErr {
  border-color: #dc2626;
}
.g_why {
  margin-top: 7px;
  font-size: 0.84rem;
  color: var(--ink-4);
  line-height: 1.5;
}
.g_cancel {
  width: 100%;
  margin-top: 10px;
  padding: 8px 0;
  border: 0;
  background: none;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--ink-3);
  cursor: pointer;
}
/* Séparateur entre Apple Pay / Google Pay et le formulaire carte. */
.g_or {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0 14px;
  font-size: 0.84rem;
  color: var(--ink-4);
}
.g_or::before,
.g_or::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
/* Sur une seule ligne : à 390 px, la taille de 0,78rem est ce qui la fait
   tenir sans couper « aucun compte à créer ». */
.g_fine {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 14px;
  font-size: 0.78rem;
  letter-spacing: -0.005em;
  white-space: nowrap;
  color: var(--ink-4);
}
.g_fine svg {
  flex: 0 0 auto;
}

/* ── Qui vend, et la renonciation ──────────────────────────────────────
   En charge directe, le vendeur est l'opérateur : il est nommé sous le
   total, comme un sous-titre. La renonciation au droit de rétractation se
   lit juste après, avant les boutons de paiement. */
.g_vend {
  margin: -14px 0 18px;
  font-size: 0.9rem;
  color: var(--ink-3);
  letter-spacing: -0.01em;
}
.g_waiver {
  margin: 0 0 16px;
  font-size: 0.8rem;
  line-height: 1.5;
  color: var(--ink-4);
  text-wrap: pretty;
}
.g_waiverLink {
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  color: var(--ink-3);
  text-decoration: underline;
  text-underline-offset: 2px;
  white-space: nowrap;
  cursor: pointer;
}
.g_waiverLink:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ── Les conditions de vente, par-dessus le paiement ───────────────────*/
.g_sheetTop {
  z-index: 80;
}
.g_cvTitle {
  margin: 0;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.24rem;
  font-weight: 600;
  letter-spacing: -0.028em;
}
.g_cvWho {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 14px 0 0;
  padding: 14px 15px;
  border: 1px solid var(--line);
  border-radius: 16px;
  font-size: 0.86rem;
  line-height: 1.5;
  color: var(--ink-2);
  overflow-wrap: anywhere;
}
.g_cvWho b {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--ink);
}
.g_cvKey {
  font-size: 0.75rem;
  letter-spacing: 0.02em;
  color: var(--ink-4);
  margin-bottom: 2px;
}
.g_cvVia {
  margin: 9px 2px 0;
  font-size: 0.8rem;
  line-height: 1.45;
  color: var(--ink-4);
}
.g_cvList {
  display: grid;
  margin: 14px 0 0;
}
.g_cvList div {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line-2);
  font-size: 0.84rem;
  line-height: 1.45;
}
.g_cvList dt {
  color: var(--ink-4);
}
.g_cvList dd {
  margin: 0;
  color: var(--ink-2);
}
.g_cvFull {
  display: inline-block;
  margin-top: 12px;
  font-size: 0.84rem;
  color: var(--ink-2);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* ── Le lien de groupe : le jour, puis l'heure ─────────────────────────
   Le jour était une rangée de pastilles au-dessus des créneaux : deux
   listes sur le même écran, et rien pour reculer. C'est désormais un écran
   à lui seul, sauté quand l'opérateur n'a publié qu'un seul jour. */
.g_slots {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 20px;
}
/* Une ligne = une heure de départ, puis l'activité. L'heure tient sa
   propre colonne, en chiffres de même largeur : les créneaux d'un même
   jour s'alignent au chiffre près et la liste se lit d'un coup d'oeil.
   Le filet sépare deux lignes au lieu de border chaque ligne, pour que la
   zone touchée puisse s'arrondir sans décaler l'alignement. */
.g_slotRow {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: calc(100% + 24px);
  margin: 0 -12px;
  padding: 16px 12px;
  border: 0;
  border-radius: 14px;
  background: none;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
}
.g_slotRow + .g_slotRow::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12px;
  right: 12px;
  border-top: 1px solid var(--line);
}
.g_slotRow:active {
  background: var(--line-2);
}
.g_slotRow:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: -2px;
}

/* La liste des jours reprend la ligne des créneaux : même hauteur, même
   chevron. Le jour prend la place que l'heure et l'activité occupent
   ailleurs — il peut être long (« Dimanche 26 juillet »). */
.g_dayH {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 1.06rem;
  font-weight: 600;
  letter-spacing: -0.022em;
}
.g_slotH {
  flex: 0 0 auto;
  min-width: 74px;
  font-size: 1.06rem;
  font-weight: 600;
  letter-spacing: -0.022em;
  font-variant-numeric: tabular-nums;
}
.g_slotA {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 1.03rem;
  letter-spacing: -0.018em;
  color: var(--ink-2);
}
.g_slotN {
  flex: 0 0 auto;
  font-size: 0.88rem;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}
.g_slotGo {
  flex: 0 0 auto;
  color: var(--ink-4);
}
.g_note {
  max-width: 920px;
  margin: 30px auto 0;
  padding: 0 20px;
  font-size: 0.86rem;
  color: var(--ink-3);
  line-height: 1.55;
  text-wrap: pretty;
}
.g_empty {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 20px 20px;
  font-size: 0.94rem;
  color: var(--ink-3);
  line-height: 1.55;
}

/* ── Ordinateur ────────────────────────────────────────────────────────
   Mêmes écrans, plus larges : quatre colonnes, et la barre d'achat devient
   une ligne. Aucune navigation ne réapparaît. */


/* Les deux écrans d'entrée de la boutique de groupe : l'accueil, où le
   client choisit son jour, et le jour ouvert, où il choisit son heure de
   départ.

   Ils sont séparés de gallery.module.css, partagé avec la boutique
   individuelle : celle-ci n'a ni couverture, ni jours, ni onglets. Le cadre
   de page et les variables (--op, --ink, --line) restent dans
   collective.module.css. */

/* ── L'accueil : la couverture et l'identité ────────────────────────────
   Un client qui vient de scanner le QR code vérifie d'abord qu'il est au bon
   endroit. La photo du prestataire le dit avant son nom, et l'écusson à
   cheval sur le bord de la photo tient les deux ensemble. */
.s_cover {
  position: relative;
  height: 208px;
}
.s_cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.s_share {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  color: var(--ink);
  cursor: pointer;
}
.s_share:active {
  background: #fff;
}
.s_share:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: 3px;
}

/* flow-root : sans lui, la marge négative de l'écusson remonterait tout le
   bloc blanc au lieu de l'écusson seul. */
.s_sheet {
  position: relative;
  display: flow-root;
  max-width: 920px;
  margin: 0 auto;
  padding: 0 20px 22px;
}
.s_badge {
  position: relative;
  z-index: 2;
  width: 92px;
  height: 92px;
  margin: -46px auto 0;
  display: grid;
  place-items: center;
  border-radius: 999px;
  border: 5px solid var(--bg);
  background: var(--op);
  color: #fff;
  overflow: hidden;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}
.s_badge img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* Sans couverture téléversée, l'écusson n'a pas de bord à enjamber : il se
   pose en haut de page, à sa place. */
.s_noCover .s_badge {
  margin-top: 26px;
}

.s_id {
  padding: 14px 0 0;
  text-align: center;
}
.s_id h1 {
  margin: 0;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.38rem;
  font-weight: 700;
  letter-spacing: -0.032em;
  line-height: 1.16;
  text-wrap: balance;
}
.s_id p {
  margin: 8px auto 0;
  max-width: 30ch;
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--ink-3);
  text-wrap: pretty;
}

.s_label {
  margin: 26px 0 0;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.s_label h2 {
  margin: 0;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.06rem;
  font-weight: 700;
  letter-spacing: -0.024em;
}
.s_label p {
  margin: 5px 0 0;
  font-size: 0.9rem;
  color: var(--ink-4);
  line-height: 1.45;
}

/* ── Les jours : des dates, pas des photos ──────────────────────────────
   Une vignette par jour donnait six photos d'activité sans rapport avec ce
   que le client cherche, qui est sa date. Le quantième porte la lecture, le
   nombre de créneaux dit si le jour vaut le geste. */
.s_days {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.s_day {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 14px 14px 15px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: none;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.14s;
}
.s_day:active {
  background: var(--line-2);
}
.s_day:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .s_day {
    transition: none;
  }
}
/* « Aujourd'hui » et « Hier » se lisent plus vite qu'une date, et ce sont
   les deux jours où le QR code est vraiment scanné. */
.s_dayWhen {
  font-size: 0.84rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink-3);
}
.s_dayNow {
  border-color: var(--op);
}
.s_dayNow .s_dayWhen {
  color: var(--op);
}
.s_dayNum {
  margin-top: 6px;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 2.5rem;
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.s_dayMonth {
  margin-top: 3px;
  font-size: 0.95rem;
  letter-spacing: -0.018em;
  color: var(--ink-2);
}
.s_dayN {
  margin-top: 9px;
  font-size: 0.84rem;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}

/* ── Le jour ouvert : la barre, les onglets, les créneaux ───────────────
   Le jour reste écrit en haut, et se change sans reculer d'un écran : le
   client qui ouvre le mauvais jour est le cas courant, pas l'exception. */
.s_bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 920px;
  margin: 0 auto;
  padding: 12px 10px;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.s_barBtn {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 0;

/* L'en-tête de l'écran des photos (maquette-parcours-achat-v2, finition C) :

   empilés à gauche ; l'heure du créneau dans une pastille à la couleur du

/* Un onglet par activité du jour : une même journée mélange canyoning et
   via ferrata, et le client ne cherche que la sienne. La barre ne s'affiche
   pas quand il n'y a qu'une activité, elle n'aurait rien à filtrer. */
.s_tabs {
  display: flex;
  gap: 4px;
  max-width: 920px;
  margin: 0 auto;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);

}

  background: none;
  font-family: inherit;
  font-size: 0.96rem;

  cursor: pointer;
}

  color: var(--ink);
  font-weight: 600;

}

  outline: 2px solid var(--op);
  outline-offset: -3px;
}

.s_list {
  max-width: 920px;
  margin: 0 auto;

}

  padding: 26px 0 2px;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.02rem;
  font-weight: 700;
  letter-spacing: -0.026em;
}

.s_row {

  display: flex;
  align-items: center;
  gap: 14px;

  margin: 0 -12px;
  padding: 16px 12px;
  border: 0;
  border-radius: 14px;
  background: none;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
}
.s_row + .s_row::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12px;
  right: 12px;
  border-top: 1px solid var(--line);
}
.s_row:active {
  background: var(--line-2);
}
.s_row:focus-visible {
  outline: 2px solid var(--op);
  outline-offset: -2px;
}

.s_rowTxt {
  flex: 1;
  min-width: 0;
}
/* L'état du lot, en premier : un créneau dont les aperçus arrivent encore
   affiche moins de photos qu'il n'en a. Sans cette ligne, le client compte
   les siennes et croit qu'il en manque. */
.s_state {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--ink-3);
}
.s_state::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--op);
}
.s_stateWait {
  color: var(--ink-4);
}
.s_stateWait::before {
  background: #ffb443;
}
.s_rowH {
  display: block;
  font-family: "Inter Tight", Inter, system-ui, sans-serif;
  font-size: 1.16rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
/* Le compte est une précision, pas un second titre : il ne doit pas
   concurrencer l'heure, que le client cherche des yeux. */
.s_state + .s_rowH {
  margin-top: 5px;
}
.s_rowN {
  display: block;
  margin-top: 3px;
  font-size: 0.9rem;
  font-weight: 400;
  letter-spacing: -0.012em;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.s_rowG {
  display: block;
  margin-top: 5px;
  font-size: 0.88rem;
  color: var(--ink-4);
}
/* La vignette suffit à dire que la ligne s'ouvre : plus de pastille
   « > » posée dessus. Elle écrivait sur la photo, par-dessus le cadenas
   du filigrane, et donnait trois points bleus à l'écran. */
.s_rowThumb {
  position: relative;
  flex: 0 0 auto;
  width: 84px;
  height: 84px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--line-2);
}
/* Un filet posé au-dessus de l'image, pour qu'une photo claire (ciel,
   neige, écume) ne se dissolve pas dans le fond blanc. */
.s_rowThumb::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(22, 19, 32, 0.08);
  pointer-events: none;
}
.s_rowThumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Le pied de l'accueil. Le lien de retrait, lui, vit sur les écrans qui
   montrent des photos : ici il n'y en a aucune à faire retirer. */
.s_foot {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 20px;
}
.s_foot > * {
  border-top: 1px solid var(--line);
}
