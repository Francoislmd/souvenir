<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquette Sorties v4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap">
<style>
:root{--brand:#ff5a1f;--brand-ink:#e8460c;--ink:#161320;--ink-2:#5a5d64;--ink-3:#726c80;--ink-4:#a6a0b2;--line:#ece9ef;--line-3:#dfdbd4;--soft:#fff1eb;--side-bg:#faf9f8;--fill:#f3f2f5;--fill-2:#eae8ee;--ok:#16a34a;--wait:#d98a06}
*{box-sizing:border-box;min-width:0}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:#fff}
::selection{background:#ffd9c7}
a{color:inherit;text-decoration:none}button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:9px}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;background:var(--side-bg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 16px 20px}
.brand{display:flex;align-items:center;gap:6px;padding:4px 10px 30px;font-family:'Inter Tight';font-weight:600;font-size:18px;letter-spacing:-.03em}
.nav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:11px;font-weight:500;color:var(--ink-2);font-size:.95rem}
.nav svg{color:var(--ink-4)}.nav:hover{background:#f1eff2;color:var(--ink)}
.nav.on{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.nav.on svg{color:var(--brand)}
.sp{flex:1}.acct{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:.88rem;font-weight:500}
.av{width:32px;height:32px;border-radius:10px;background:var(--fill-2);display:grid;place-items:center;font-size:.75rem;color:var(--ink-2)}
.main{flex:1}
.wrap{max-width:1160px;margin:0 auto;padding:0 48px 100px}
.hdr{display:flex;align-items:center;gap:14px;min-height:96px}
.hdr h1{font-family:'Inter Tight';font-weight:600;font-size:1.9rem;letter-spacing:-.035em;margin:0;flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font-weight:500;font-size:.95rem;white-space:nowrap;transition:background .14s}
.pri{background:var(--brand);color:#fff}.pri:hover{background:var(--brand-ink)}
.ghost{background:var(--fill);color:var(--ink)}.ghost:hover{background:var(--fill-2)}
.sm{height:36px;padding:0 13px;font-size:.88rem;border-radius:10px}
.day{display:flex;align-items:baseline;gap:10px;margin:34px 0 16px;font-size:.95rem;font-weight:500}
.day em{font-style:normal;font-weight:400;color:var(--ink-4)}
.day .n{margin-left:auto;font-size:.85rem;color:var(--ink-4);font-weight:400}
.st{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;color:var(--ink-3);white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:var(--ok)}.st.w i{background:var(--wait)}.st.e i{background:var(--ink-4)}
.amt{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gl{width:36px;height:36px;border-radius:10px;background:var(--soft);color:#ea4d10;display:grid;place-items:center;flex:0 0 auto}
.gl svg{width:19px;height:19px}
/* ===== A : cartes ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .16s}
.card:hover{border-color:var(--line-3)}
.cov{aspect-ratio:16/10;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#fff;overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .cov img{transform:scale(1.03)}
.cov img:first-child{grid-row:span 2}
.cov.one{grid-template-columns:1fr;grid-template-rows:1fr}
.drop{aspect-ratio:16/10;margin:10px 10px 0;border:1.5px dashed var(--line-3);border-radius:12px;background:var(--side-bg);display:grid;place-items:center;text-align:center;color:var(--ink-3);font-size:.9rem;transition:background .16s,border-color .16s}
.card:hover .drop{background:#fff7f3;border-color:#ffc3a6;color:var(--brand-ink)}
.drop b{display:block;font-weight:500;color:var(--ink);margin-top:10px}
.drop svg{color:var(--brand)}
.cb{display:flex;align-items:flex-end;gap:12px;padding:14px 16px 16px}
.cb .t{flex:1}
.cb .t b{display:block;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb .t span{display:block;font-size:.88rem;color:var(--ink-4);margin-top:3px}
.cb .r{text-align:right}.cb .r .amt{display:block;font-size:1.05rem}.cb .r small{display:block;font-size:.82rem;color:var(--ink-4);margin-top:2px}
/* ===== B : liste avec aperçus ===== */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:36px minmax(160px,1fr) auto 150px;align-items:center;gap:18px;padding:14px 12px;margin:0 -12px;border-radius:14px;transition:background .15s}
.row:hover{background:var(--side-bg)}
.row .t b{display:block;font-weight:500;letter-spacing:-.02em}
.row .t span{display:block;font-size:.88rem;color:var(--ink-4);margin-top:3px}
.strip{display:flex;gap:4px}
.strip img,.strip .more{width:58px;height:44px;border-radius:8px;object-fit:cover;display:block}
.strip .more{background:var(--fill);display:grid;place-items:center;font-size:.8rem;color:var(--ink-3);font-weight:500}
.strip .none{height:44px;display:flex;align-items:center;font-size:.86rem;color:var(--ink-4)}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row .r small{font-size:.82rem;color:var(--ink-4)}
/* ===== C ===== */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.sec{font-size:.95rem;font-weight:500;margin:44px 0 6px}
/* sélecteur de maquette */
.pick{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--ink);border-radius:14px;z-index:9}
.pick button{color:#cfcad8;height:36px;padding:0 14px;border-radius:10px;font-size:.86rem;font-weight:500}
.pick button.on{background:#fff;color:var(--ink)}
.v{display:none}.v.on{display:block}
@media (max-width:1100px){.today{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:36px 1fr auto}.row .strip{display:none}}
@media (max-width:760px){.side{display:none}.wrap{padding:0 18px 110px}.hdr{min-height:76px}.hdr h1{font-size:1.5rem}.today{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hdr .btn span{display:none}.hdr .btn{padding:0 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

const pl=(n,w)=>n+' '+w+(n>1?'s':'');
const meta=x=>[x.h, x.s==='w'?pl(x.ph,'photo')+' déposées':x.pp?pl(x.pp,'participant'):x.ph?pl(x.ph,'photo'):null].filter(Boolean).join(' · ');
function right(x,cls){
 if(x.s==='e') return '';
 if(x.s==='w') return '<span class="btn ghost sm">Publier</span>';
 if(x.paid) return `<span class="amt">${x.amt}</span><small>${pl(x.paid,'achat')}</small>`;
 return '<span class="st"><i></i>En ligne</span>';
}
function card(x){
 const top = x.s==='e' ? `<div class="drop"><div>${UP}<b>Déposer les photos</b>Glissez la carte mémoire ici</div></div>`
   : `<div class="cov">${x.pics.slice(0,3).map(k=>`<img src="${P[k]}" alt="">`).join('')}</div>`;
 const st = x.s==='w' ? '<span class="btn pri sm">Publier</span>' : x.s==='e'?'': right(x);
 return `<a class="card" href="#">${top}<div class="cb"><div class="t"><b>${x.a}, ${x.p}</b><span>${meta(x)}</span></div><div class="r">${st}</div></div></a>`;
}
function row(x){
 let strip;
 if(x.s==='e') strip='<span class="btn ghost sm">'+UP.replace('22','16').replace('22','16')+' Ajouter les photos</span>';
 else { const shown=x.pics.slice(0,4); strip='<div class="strip">'+shown.map(k=>`<img src="${P[k]}" alt="">`).join('')+(x.ph>4?`<span class="more">+${x.ph-4}</span>`:'')+'</div>'; }
 const r = x.s==='e' ? '' : x.s==='w' ? '<span class="btn pri sm">Publier</span>' : right(x);
 return `<a class="row" href="#"><span class="gl">${G}</span><span class="t"><b>${x.a}, ${x.p}</b><span>${meta(x)}</span></span>${strip}<span class="r">${r}</span></a>`;
}
const head=g=>`<div class="day">${g.d}${g.e?`<em>${g.e}</em>`:''}<span class="n">${pl(g.items.length,'sortie')}</span></div>`;
vA.innerHTML=DAYS.map(g=>head(g)+'<div class="grid">'+g.items.map(card).join('')+'</div>').join('');
vB.innerHTML=DAYS.map(g=>head(g)+'<div class="list">'+g.items.map(row).join('')+'</div>').join('');
vC.innerHTML=head(DAYS[0])+'<div class="today">'+DAYS[0].items.map(card).join('')+'</div>'+DAYS.slice(1).map(g=>head(g)+'<div class="list">'+g.items.map(row).join('')+'</div>').join('');
